
<div class="subheader">
  <ion-toolbar>
    <ion-list class="examValues">
      <ion-item>
        <ion-input
          type="text"
          [(ngModel)]="data.exam.testName"
          name="theme"
          label="Theme" 
          placeholder="Enter Theme"
          label-placement="floating" 
          fill="outline" 
          value="">
        </ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          type="number"
          [(ngModel)]="data.exam.weight"
          name="weight"
          label="Weight" 
          placeholder="Enter Weight"
          label-placement="floating" 
          fill="outline" 
          value="">
        </ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          type="text"
          [(ngModel)]="data.exam.description"
          name="description"
          label="Description" 
          placeholder="Enter Description"
          label-placement="floating" 
          fill="outline" 
          value="">
      </ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          type="text"
          [(ngModel)]="data.exam.location"
          name="location"
          label="Location" 
          placeholder="Enter Location"
          label-placement="floating" 
          fill="outline" 
          value="">
        </ion-input>
      </ion-item>
      <ion-item>
        Date   
        <ion-datetime-button slot="end" datetime="date"></ion-datetime-button>
      </ion-item>
      <ion-item>
        Starttime   
        <ion-datetime-button slot="end" datetime="starttime"></ion-datetime-button>
      </ion-item>
      <ion-item>
        Endtime  
        <ion-datetime-button slot="end" datetime="endtime"></ion-datetime-button>
      </ion-item>
    </ion-list>
    <ion-button (click)="saveChanges()">Save Changes</ion-button>

  </ion-toolbar>
</div>
<ion-content>
  <div>
  @if (this.eventID!=0){
    <ion-list class="grades">
      @for(student of data.grades; track student.firstName ){
        <ion-item>
          <ion-list class="gradesValues">
            <ion-item>
              <p>{{student.firstName}}, {{student.lastName}}</p>
            </ion-item>
            <ion-item>
              <ion-input
                type="text"
                [(ngModel)]="student.message"
                name="Message"
                label="Message" 
                placeholder="Enter Message"
                label-placement="floating" 
                fill="outline" 
                value="">
              </ion-input>
            </ion-item>
            <ion-item>
              <ion-input
                type="number"
                [(ngModel)]="student.grade"
                name="Grade"
                label="Grade" 
                placeholder="Enter Grade"
                label-placement="floating" 
                fill="outline" 
                value="">
              </ion-input>
            </ion-item>
            <ion-item>
              upload File
            </ion-item>
          </ion-list>
        </ion-item>
      }
    </ion-list>
  }
  </div>
</ion-content>

<ion-modal [keepContentsMounted]="true">
  <ng-template>
    <ion-datetime 
      displayFormat="YYYY-MM-DD" 
      pickerFormat="YYYY-MM-DD"
      [(ngModel)]="this.data.exam.date" 
      id="date"
      presentation="date"
    ></ion-datetime>
  </ng-template>
</ion-modal>
<ion-modal [keepContentsMounted]="true">
  <ng-template>
    <ion-datetime 
      displayFormat="HH:mm" 
      pickerFormat="HH:mm"
      [(ngModel)]="this.data.exam.starttime" 
      id="starttime"
      presentation="time"
    ></ion-datetime>
  </ng-template>
</ion-modal>
<ion-modal [keepContentsMounted]="true">
  <ng-template>
    <ion-datetime 
      displayFormat="HH:mm" 
      pickerFormat="HH:mm"
      [(ngModel)]="this.data.exam.endtime" 
      id="endtime"
      presentation="time"
    ></ion-datetime>
  </ng-template>
</ion-modal>
