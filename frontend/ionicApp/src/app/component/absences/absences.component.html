Absences
@for(absence of this.absences; track absence.eventID){
  <ion-item>
    <ion-list>
      <ion-item>
        {{this.displayDateTime(absence)}}
      </ion-item>
      <ion-item>
        {{absence.lessons}}
      </ion-item>
      <ion-item>
        @if(absence.excused){
          <p style="color: green;">Excused</p>
        }@else{
          <p style="color: red;">not Excused</p>

        }
      </ion-item>
    </ion-list>
  </ion-item>
}
