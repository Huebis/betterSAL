@for (course of classes; track course.courseID) {
  <section class="class">
      <ion-button (click)="toggleClass(course)" class="class-band">
        <ion-label class="class-name" slot="start">
          Class: {{ course.courseName }}
        </ion-label>
      </ion-button>

      <div [ngClass]="{'expanded': course.open, 'collapsed': !course.open}">
        @if (course.open){
          <ion-list>
              <ion-item class="date">
                <ion-label class="full-text">
                  Date
                </ion-label>
                <ion-label class="first-letter">
                  D
                </ion-label>
              </ion-item>
              <ion-item class="name">
                <ion-label class="full-text">
                  Theme
                </ion-label>
                <ion-label class="first-letter">
                  T
                </ion-label>
              </ion-item>
              <ion-item class="weight">
                <ion-label class="full-text">
                Weight
              </ion-label>
              <ion-label class="first-letter">
                W
              </ion-label>
            </ion-item> 
            <ion-item></ion-item>    
            @for (e of course.exams; track e.evenID ?? $index) {
                <ion-item class="date">
                  {{e.date}}
                </ion-item>
                <ion-item class="name">
                  {{e.testName}}
                </ion-item>
                <ion-item class="weight">
                  {{e.weight}}
                </ion-item>   
                <ion-button (click)="editGrade(''+course.courseID,''+e.eventID)">
                  Change
                </ion-button>
            }
            <ion-button (click)="editGrade(''+course.courseID,'0')">
              Add Grade
            </ion-button>
          </ion-list>
        }
      </div>
  </section>
}
