
<div class="subheader">
  <ion-toolbar>
    <ion-list class="examValues">
      <ion-item>
        <ion-input
        (ionChange)="somethingChanged=false"
        type="text"
        [(ngModel)]="data.exam.testName"
        name="theme"
        label="Theme" 
        placeholder="Enter Theme"
        label-placement="floating" 
        fill="outline" 
        value="">
        </ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          (ionChange)="somethingChanged=false"
          type="number"
          [(ngModel)]="data.exam.weight"
          name="weight"
          label="Weight" 
          placeholder="Enter Weight"
          label-placement="floating" 
          fill="outline" 
          value="">
        </ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          (ionChange)="somethingChanged=false"
          type="text"
          [(ngModel)]="data.exam.description"
          name="description"
          label="Description" 
          placeholder="Enter Description"
          label-placement="floating" 
          fill="outline" 
          value="">
      </ion-input>
      </ion-item>
      <ion-item>
        <ion-input
          (ionChange)="somethingChanged=false"
          type="text"
          [(ngModel)]="data.exam.location"
          name="location"
          label="Location" 
          placeholder="Enter Location"
          label-placement="floating" 
          fill="outline" 
          value="">
        </ion-input>
      </ion-item>
      <ion-item>
        <ion-datetime-button (ionChange)="somethingChanged=false" datetime="date"
        ></ion-datetime-button>
      </ion-item>
      <ion-item>   
        <ion-datetime-button  datetime="starttime"></ion-datetime-button>
      </ion-item>
      <ion-item>  
        <ion-datetime-button (ionChange)="somethingChanged=false" datetime="endtime"></ion-datetime-button>
      </ion-item>
    </ion-list>
    <ion-item>
      <ion-button (click)="saveChanges()" [disabled]="somethingChanged">Save Changes</ion-button>
      <ion-button slot="end" (click)="deleteTest()" color="danger">Delet Test</ion-button>
    </ion-item>
  </ion-toolbar>
</div>
<ion-content>
  <div>
  @if (this.eventID!=0){
    <ion-list class="grades">
      @for(student of data.grades; track student.firstName ){
        <ion-item>
          <ion-list class="gradesValues">
            <ion-item>
              <p>{{student.firstName}}, {{student.lastName}}</p>
            </ion-item>
            <ion-item>
              <ion-input
                (ionChange)="somethingChanged=false"
                type="text"
                [(ngModel)]="student.message"
                name="Message"
                label="Message" 
                placeholder="Enter Message"
                label-placement="floating" 
                fill="outline" 
                value="">
              </ion-input>
            </ion-item>
            <ion-item>
              <ion-input
                (ionChange)="somethingChanged=false"
                type="number"
                [(ngModel)]="student.grade"
                name="Grade"
                label="Grade" 
                placeholder="Enter Grade"
                label-placement="floating" 
                fill="outline" 
                value="">
              </ion-input>
            </ion-item>
            <app-file-upload [item]="student" (change)="saveChanges()"></app-file-upload>
          </ion-list>
        </ion-item>
      }
    </ion-list>
  }
  </div>
</ion-content>

<ion-modal [keepContentsMounted]="true">
  <ng-template>
    <ion-datetime 
      (ionChange)="somethingChanged=false"
      id="date"
      displayFormat="YYYY-MM-DD HH:MM" 
      pickerFormat="YYYY-MM-DD HH:MM"
      [(ngModel)]="this.starttime"
      presentation="date"
    ></ion-datetime>
  </ng-template>
</ion-modal>
<ion-modal [keepContentsMounted]="true">
  <ng-template>
    <ion-datetime 
      (ionChange)="somethingChanged=false"
      displayFormat="YYYY-MM-DD HH:MM" 
      pickerFormat="YYYY-MM-DD HH:MM"
      [(ngModel)]="this.data.exam.starttime" 
      id="starttime"
      presentation="time"
    ></ion-datetime>
  </ng-template>
</ion-modal>
<ion-modal [keepContentsMounted]="true">
  <ng-template>
    <ion-datetime 
      (ionChange)="somethingChanged=false"
      displayFormat="HH:mm" 
      pickerFormat="HH:MM"
      [(ngModel)]="this.data.exam.endtime" 
      id="endtime"
      presentation="time"
    ></ion-datetime>
  </ng-template>
</ion-modal>
