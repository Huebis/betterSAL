<ion-header>
  <ion-toolbar color="tertiary">
    <ion-title>Conditionals</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <app-video style="display: block; width: 60%; margin: 0 auto; aspect-ratio: 16/9;"></app-video>
  <ion-accordion-group>
    <ion-accordion *ngFor="let einheit of uebungen; let i = index" [value]="'einheit' + i">
      
      <ion-item slot="header" color="light">
        <ion-icon name="book-outline" slot="start"></ion-icon>
        <ion-label>{{ einheit.titel }}</ion-label>
      </ion-item>

      <div class="ion-padding" slot="content">
        <div class="exercise-text ion-padding-bottom">
          <p>{{ einheit.beschreibung }}</p>
        </div>

        <hr />

        <h3>Exercise:</h3>
        <ion-card *ngFor="let item of einheit.aufgaben; let j = index" style="margin-inline: 0;">
          <ion-card-content>
            <p class="question-text"><strong>Question {{ j + 1 }}:</strong> {{ item.frage }}</p>

            <ion-item lines="none" style=" border-radius: 8px;">
              <ion-input [(ngModel)]="item.userEingabe" placeholder="Antwort..."></ion-input>
            </ion-item>

            <div class="ion-margin-top">
              <ion-button 
                  size="small" 
                  (click)="checkLoesung(item)" 
                  [color]="item.geloest ? 'success' : (item.istFalsch ? 'danger' : 'primary')">
                  check
              </ion-button>
              <ion-button fill="clear" size="small" (click)="toggleLoesung(item)">
                {{ item.zeigeLoesung ? 'Verstecken' : 'Show solution' }}
              </ion-button>
            </div>

            <div *ngIf="item.zeigeLoesung" class="ion-padding-top solution-box">
              <ion-text color="medium"><small>Solution: {{ item.antwort }}</small></ion-text>
            </div>
            
            <ion-text color="success" *ngIf="item.geloest">
              <p>Right!</p>
            </ion-text>
          </ion-card-content>
        </ion-card>
      </div>

    </ion-accordion>
  </ion-accordion-group>
</ion-content>
