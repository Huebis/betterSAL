<ng-template #itemTemplate let-item let-headerItems="headerItems">
  <div style="display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;">
      <div>{{ item.testName }}</div>
      <div>{{ item.date }}</div>
      <div>{{ item.weight }}</div>
      <div>
        <ion-button color="primary" (click)="editGrade(headerItems.courseID,item.eventID)">Prüfung ändern</ion-button>

      </div>
  </div>
</ng-template>
<ng-template #headerTemplate let-item>
  <p> {{item.courseName}}</p>
  <ion-button color="primary" (click)="editGrade(''+item.courseID,'0')">Neue Prüfung erstellen</ion-button>
</ng-template>



@for (course of courses; track $index){
  <app-dropdown 
    [headerItems]="course" 
    [items]="course.exams" 
    [headerTemplate]="headerTemplate" 
    [itemTemplate]="itemTemplate">
  </app-dropdown>
}
