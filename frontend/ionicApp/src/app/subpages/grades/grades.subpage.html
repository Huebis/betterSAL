<ng-template #itemTemplate let-item>
  <div style="display: grid;
    grid-template-columns: 1fr 1fr 1fr;">
      <div>{{ item.testName }}</div>
      <div>{{ item.date }}</div>
      <div>{{ item.grade }}</div>
  </div>
</ng-template>
<ng-template #headerTemplate let-item>
  <p> {{item.name}}</p>
  <p> {{this.getAverage(item.grades)}}</p>
</ng-template>



@for (subject of subjects; track $index){
  <app-dropdown 
    [headerItems]="subject" 
    [items]="subject.grades" 
    [headerTemplate]="headerTemplate" 
    [itemTemplate]="itemTemplate">
  </app-dropdown>
}
