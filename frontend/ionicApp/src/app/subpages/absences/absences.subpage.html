<ng-template #notExcusedItemTemplate let-item>
   <div>
    {{item.events[0].starttime}}
    {{item.events[item.events.length-1].endtime}}
    {{item.length}}
   </div>
</ng-template>
<ng-template #notExcusedHeaderTemplate>
    <p> Not Excused </p>
</ng-template>



<app-dropdown 
    [items]="this.absences.notExcused" 
    [headerTemplate]="notExcusedHeaderTemplate" 
    [itemTemplate]="notExcusedItemTemplate">
</app-dropdown>
